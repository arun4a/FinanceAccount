<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Deposit Report')}"></head>
<body>
<header th:replace="~{fragments/layout :: menu('report')}"></header>
<main class="page wide">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <nav th:replace="~{fragments/reportTabs :: tabs('deposits')}"></nav>

    <form class="card card-body search-grid" th:action="@{/reportDeposits}" method="get">
        <div class="field">
            <label for="startDate">Start Date</label>
            <input id="startDate" type="date" name="startDate" th:value="${startDate}" required>
        </div>
        <div class="field">
            <label for="endDate">End Date</label>
            <input id="endDate" type="date" name="endDate" th:value="${endDate}" required>
        </div>
        <div class="field">
            <label for="status">Status</label>
            <select id="status" name="status">
                <option value="" th:selected="${status == ''}">All</option>
                <option value="In" th:selected="${status == 'In'}">In</option>
                <option value="Out" th:selected="${status == 'Out'}">Out</option>
            </select>
        </div>
        <div class="actions" style="margin-top: 0;">
            <button class="btn" type="submit">Submit</button>
        </div>
    </form>

    <div th:replace="~{fragments/layout :: totals}"></div>

    <div class="totals-bar" style="margin-top: 12px;">
        <span>Total Amount: <b th:text="${amountTotal}">0</b></span>
        <span>Total Paid Amount: <b th:text="${paidTotal}">0</b></span>
    </div>

    <section class="card" style="margin-top: 18px;">
        <div class="card-header"><h2>Deposit Report</h2></div>
        <div class="table-wrap">
            <table class="data-table">
                <thead>
                <tr>
                    <th>A/C No</th>
                    <th>Deposit Name</th>
                    <th>Mobile Number</th>
                    <th class="num">Amount</th>
                    <th class="num">Paid Interest</th>
                    <th>Open Date</th>
                    <th>Close Date</th>
                    <th class="center">Status</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="d : ${report}">
                    <td th:text="${d.accountNumber}">A/C</td>
                    <td th:text="${d.depositName}">Deposit</td>
                    <td th:text="${d.mobileNo}">-</td>
                    <td class="num" th:text="${d.amount}">0</td>
                    <td class="num" th:text="${d.paidAmount}">0</td>
                    <td th:text="${d.openDate}">-</td>
                    <td th:text="${d.closeDate}">-</td>
                    <td class="center" th:text="${d.depositType}">In</td>
                </tr>
                </tbody>
            </table>
        </div>
        <p class="empty" th:if="${#lists.isEmpty(report)}">No deposits found for the selected dates.</p>
    </section>
</main>
<script th:src="@{/script/app.js}"></script>
</body>
</html>
