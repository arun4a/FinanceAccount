<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Extra Transaction Report')}"></head>
<body>
<header th:replace="~{fragments/layout :: menu('report')}"></header>
<main class="page">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <nav th:replace="~{fragments/reportTabs :: tabs('extra')}"></nav>

    <form class="card card-body search-grid" th:action="@{/reportExtraTransaction}" method="get">
        <div class="field">
            <label for="startDate">Start Date</label>
            <input id="startDate" type="date" name="startDate" th:value="${startDate}" required>
        </div>
        <div class="field">
            <label for="endDate">End Date</label>
            <input id="endDate" type="date" name="endDate" th:value="${endDate}" required>
        </div>
        <div class="actions" style="margin-top: 0;">
            <button class="btn" type="submit">Submit</button>
        </div>
    </form>

    <div th:replace="~{fragments/layout :: totals}"></div>

    <div class="totals-bar" style="margin-top: 12px;">
        <span>Total Extra Transaction Amount: <b th:text="${amountTotal}">0</b></span>
    </div>

    <section class="card" style="margin-top: 18px;">
        <div class="card-header"><h2>Extra Transaction Report</h2></div>
        <div class="table-wrap">
            <table class="data-table">
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Purpose</th>
                    <th class="num">Amount</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="t : ${report}">
                    <td th:text="${t.extraDate}">Date</td>
                    <td th:text="${t.extraPurpose}">Purpose</td>
                    <td class="num" th:text="${t.extraAmount}">0</td>
                </tr>
                </tbody>
            </table>
        </div>
        <p class="empty" th:if="${#lists.isEmpty(report)}">No extra transactions found for the selected dates.</p>
    </section>
</main>
<script th:src="@{/script/app.js}"></script>
</body>
</html>
